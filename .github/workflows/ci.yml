name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js

      - name: Validate manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/en.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/zh.json', 'utf8'))"
          node -e "const p = require('./package.json'); if (!p.dsh?.bundle?.patch) throw new Error('missing dsh.bundle.patch'); if (!p.dsh?.client) throw new Error('missing dsh.client')"

      - name: Package contents
        run: npm pack --dry-run
